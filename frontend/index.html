<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MusicChef – Lerne Musik kennen, spielerisch und unterhaltsam" />
    <title>MusicChef</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA: restore original path saved by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
